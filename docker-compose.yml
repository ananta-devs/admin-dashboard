services:
  postgres:
    image: postgres:16-alpine
    container_name: vibe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibe_enterprise}
      POSTGRES_USER: ${POSTGRES_USER:-vibe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secret_postgres_pass_change_in_prod}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./backups/wal_archive:/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    container_name: vibe_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-dev_secret_redis_pass_change_in_prod}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_secret_redis_pass_change_in_prod}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - backend_net

  analytics-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibe_analytics_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=1
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vibe_admin}:${POSTGRES_PASSWORD:-dev_secret_postgres_pass_change_in_prod}@postgres:5432/${POSTGRES_DB:-vibe_enterprise}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_secret_redis_pass_change_in_prod}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-dev_secret_redis_pass_change_in_prod}@redis:6379/1
      REPORT_RENDERER_SERVICE_URL: http://report-renderer:8080
      REPORT_RENDERER_SECRET: ${REPORT_RENDERER_SECRET:-dev_report_renderer_secret_key_change_in_production}
      POLARS_MAX_THREADS: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - ./backend:/app:ro
      - ./backend/uploads/analytics:/app/uploads/analytics:rw
      - ./backend/uploads/reports:/app/uploads/reports:rw
    mem_limit: 1024m
    memswap_limit: 1024m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - backend_net
      - renderer_net

  outbox-dispatcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibe_outbox_dispatcher
    restart: unless-stopped
    command: python -m app.tasks.dispatcher
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vibe_admin}:${POSTGRES_PASSWORD:-dev_secret_postgres_pass_change_in_prod}@postgres:5432/${POSTGRES_DB:-vibe_enterprise}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_secret_redis_pass_change_in_prod}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-dev_secret_redis_pass_change_in_prod}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - backend_net

  report-renderer:
    build:
      context: ./backend
      dockerfile: Dockerfile.renderer
    container_name: vibe_report_renderer
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./docker/seccomp-chromium.json
    environment:
      REPORT_RENDERER_SECRET: ${REPORT_RENDERER_SECRET:-dev_report_renderer_secret_key_change_in_production}
      NODE_ENV: production
    tmpfs:
      - /tmp:rw,size=512m
      - /home/renderer/.cache:rw,size=64m
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    networks:
      - renderer_net

volumes:
  postgres_data:
    name: vibe_postgres_data
  redis_data:
    name: vibe_redis_data

networks:
  backend_net:
    name: vibe_backend_net
    driver: bridge
  renderer_net:
    name: vibe_renderer_net
    driver: bridge
    internal: true
